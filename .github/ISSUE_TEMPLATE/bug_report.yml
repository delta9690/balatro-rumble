name: Bug report
description: Something's broken, or the rumble feels wrong.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more detail you can
        give, the faster I can actually fix it instead of guessing.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. What did you expect to happen, and what actually happened?
      placeholder: "e.g. Cash out doesn't rumble at all, but coins do."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How do I make this happen? Be as specific as you can.
      placeholder: |
        1. Go to ...
        2. Click / press ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and, if relevant, whether you're on Proton/Wine.
      placeholder: "e.g. Windows 11 (native), or Linux via Proton"
    validations:
      required: true

  - type: input
    id: controller
    attributes:
      label: Controller
      description: What gamepad are you using?
      placeholder: "e.g. Xbox Series X controller, DualSense, Switch Pro"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Mod version
      description: Which version of Rumble are you running?
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant settings
      description: |
        Anything you've changed from the defaults that might matter — master
        strength, a category's power/profile, kick mode, spinup assist, etc.
      placeholder: "e.g. I set kick_mode to Absolute and raised cash_out power to 100."
    validations:
      required: false

  - type: textarea
    id: debug-log
    attributes:
      label: Debug log
      description: |
        **Please attach your debug log.** It's the single most useful thing
        you can give me.

        How to get it:
        1. In-game, open the Rumble mod menu and enable **Debug Log**.
        2. Reproduce the bug.
        3. Quit the game.
        4. Find `rumble_debug.log` in Balatro's save directory — the same
           folder your profile lives in (on Windows this is usually
           `%appdata%/Balatro`, on Linux in your Steam compat data path).
        5. Drag the file into this box, or paste the relevant lines.

        If the log is huge, the last ~100 lines around the bug are usually
        enough — but the header at the top (mod version, OS, backend) is
        always helpful too.

        PLEASE don't copy plain text. Put it in a codebox, upload it to pastebin, whatever.
      placeholder: "Paste log lines here, or attach rumble_debug.log"
    validations:
      required: false

  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: Other mods installed, screenshots, videos, whatever helps.
    validations:
      required: false